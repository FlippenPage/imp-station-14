- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatMummyCrown
  name: ancient crown
  description: An incredible archaeological find that obviously belongs directly on top of your head as soon as possible.
  components:
  - type: Sprite
    sprite: _Impstation/Clothing/Head/Helmets/mummycrown.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Impstation/Clothing/Head/Helmets/mummycrown.rsi
    clothingVisuals:
      head:
      - state: equipped-head
        offset: "0, 0.125"
      - state: equipped-head-unshaded
        shader: unshaded
        offset: "0, 0.125"
      head-mummy: #MUMMY TODO: more species variants
      - state: equipped-head-mummy
        offset: "0, 0.1875"
      - state: equipped-head-unshaded-mummy
        shader: unshaded
        offset: "0, 0.1875"
      head-vox:
      - state: equipped-head-vox
        offset: "0, 0.125"
      - state: equipped-head-unshaded-vox
        shader: unshaded
        offset: "0, 0.125"
  - type: ClothingLatchOn
  - type: ClothingGrantAction
    action: ActionSandWave
  - type: ClothingGrantComponent
    component:
    - type: BreathingImmune
    - type: PressureImmunity
    - type: TemperatureProtection
      heatingCoefficient: 1.0
    - type: Armor
      modifiers:
        coefficients: # liddle bit worse than heretic armor
          Blunt: 0.60
          Slash: 0.60
          Piercing: 0.60
          Heat: 0.60
          Caustic: 0.60
  - type: MummyArtifact
  - type: AddGameruleOnEquip
    gameRule: MummySpawnOnCrownEquip


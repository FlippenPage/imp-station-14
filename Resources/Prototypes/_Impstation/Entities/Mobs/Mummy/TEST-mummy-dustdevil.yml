- type: entity
  name: dust devil
  parent: [BaseSimpleMob]
  id: MobMummyDustDevil
  description: It twists and swirls and meows with renewed ferocity.
  components:
  - type: Sprite
    drawdepth: Mobs
    state: mummynado
    sprite: _Impstation/Effects/dustdevil.rsi
  - type: Physics
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: MovementIgnoreGravity
    weightless: true
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 3 
    baseSprintSpeed: 4.2
    baseWeightlessModifier: 1.5
    baseWeightlessFriction: 1.5
    weightlessFrictionNoInput: 4
    baseWeightlessAcceleration: 4
  - type: Fixtures
    fixtures:
      fix1:
        density: 7
        restitution: 1.0
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 10
  - type: DamageContacts
    damage:
      types:
        Slash: 15 #MUMMY TODO: I DONT KNOWWW I DONT KNOW DAMAGE!! IS THIS A LOT I DONT KNOWWWW!!!!
  - type: NpcFactionMember
    factions:
    - Mummy
  - type: WalkingConvertsTiles
    conversionTile: FloorMummyDesert
  - type: FloatingVisuals
  - type: Climbing
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: CollisionFilter
    requiredTags: [MummyMinion]
  - type: Tag #mummy tag for imprinting mobs
    tags:
    - DoorBumpOpener
    - Mummy

# Polymorph proto for Dust Devil
- type: polymorph
  id: DustDevil
  configuration:
    entity: MobMummyDustDevil
    transferName: true
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
    transferDamage: true

- type: entity
  parent: BaseComputer
  id: ComputerReaperTeleporter
  name: teleportation console
  description: A recovered mortal artifact hastily reconfigured to teleport Reapers.
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Impstation/Structures/Machines/computer_old.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
      sprite: _Impstation/Structures/Machines/computer_old.rsi
    - map: ["computerLayerKeyboard"]
      state: keyboard
      sprite: _Impstation/Structures/Machines/computer_old.rsi
    - map: ["computerLayerScreen"]
      state: reaper
    offset: "0.0,0.1"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.TeleportLocationUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TeleportLocationUiKey.Key:
        type: TeleportLocationsBoundUserInterface
  - type: PointLight
    radius: 2.4 #imp
    energy: 1.6
    color: "#ffffff"
  - type: TeleportLocations
    name: teleportation-console-window-title
    teleportEffect: WizardSmoke
    closeAfterTeleport: true
  - type: UseDelay
    delay: 1
    delays:
      TeleportDelay: !type:UseDelayInfo
        length: 300
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: monitorBroken
      - !type:DoActsBehavior
        acts: ["Destruction"]

# kill this for personal economy okay?
- type: entity
  parent: ComputerBroken
  id: ComputerFundingAllocationBroken
  name: broken funding allocation computer
  description: Terminal for controlling the distribution of funds and pay to departments. What happened to it?

- type: entity
  parent: [ BaseComputer, Tier2Contraband ]
  id: ComputerDropPodSyndie
  name: syndicate drop pod launch terminal
  description: Used to initiate a drop. Can only be used once.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
      sprite: _Impstation/Structures/Machines/computers.rsi # imp
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
      sprite: _Impstation/Structures/Machines/computers.rsi # imp
    - map: ["computerLayerScreen"]
      state: syndishuttle
    - map: ["computerLayerKeys"]
      state: syndie_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
      sprite: _Impstation/Structures/Machines/computers.rsi # imp
  - type: Tag
    tags:
      - Syndicate
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#c94242"
  - type: ActivatableUI
    key: enum.DropPodLocationsUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DropPodLocationsUiKey.Key:
        type: DropPodLocationsBUI
  - type: DropPodConsole
    name: drop pod console
    blacklist:
      tags:
      - Handcuffs
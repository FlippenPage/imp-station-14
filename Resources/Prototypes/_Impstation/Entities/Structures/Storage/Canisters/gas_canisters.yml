- type: entity
  parent: GasCanister
  id: RetroOxygenCanister
  name: retro oxygen canister
  description: A canister that can contain any type of gas. This one is supposed to contain oxygen. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Machines/computers.rsi
    layers:
      - state: retro_blue
  - type: GasCanister
    gasMixture:
      volume: 1000
      moles:
        - 1871.71051 # oxygen
      temperature: 293.15
  - type: Appearance
  - type: GenericVisualizer
    visuals:
       enum.GasCanisterVisuals.PressureState:
         pressureLight:
           0: { state: retro_can-o0, shader: "unshaded" }
           1: { state: retro_can-o1, shader: "unshaded" }
           2: { state: retro_can-o2, shader: "unshaded" }
           3: { state: retro_can-o3, shader: "unshaded" }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          RetroOxygenCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior


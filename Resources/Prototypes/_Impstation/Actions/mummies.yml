- type: entity
  parent: BaseAction
  id: ActionSandWave
  name: Sand Wave
  description: Summons a sand wave to push back aggressors.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: Actions/smokeaction.rsi # MUMMY TODO: sprite
      state: smokeaction
    priority: 4
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: SandWave
      posData: !type:TargetCasterPos

- type: entity
  parent: BaseAction
  id: ActionPolymorphDustDevil
  name: Dust Devil Form
  description: Transforms you into a fearsome dust tornado!
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      state: mummynado
      sprite: _Impstation/Effects/dustdevil.rsi # MUMMY TODO: sprite
    priority: 1
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: DustDevil

- type: entity
  parent: BaseAction
  id: ActionScarabThrow
  name: Throw Scarab
  description: Throws a scarab that is sure to hunt down your adversaries.
  components:
  - type: Action
    icon: { sprite : _Impstation/Mobs/Animals/scarab.rsi, state: alive }
    itemIconStyle: BigAction
    priority: 3
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:ActionGunShootEvent

- type: entity
  parent: BaseAction
  id: ActionMummyWall
  name: Dust Wall
  description: Creates a dusty mewling barrier.
  components:
  - type: Action
    useDelay: 3 
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg #MUMMY TODO: mummy sounds
    icon:
      sprite: _Impstation/Structures/Magic/mummysandwall.rsi #MUMMY TODO: mummy action icons
      state: mummysandwall
    priority: 2
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: WallForceMummySpawn
      posData: !type:TargetInFront

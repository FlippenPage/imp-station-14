- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMummy
  categories: [ HideSpawnMenu ] 
  name: mummy appearance
  components:
  - type: Inventory
    speciesId: mummy
    templateId: mummy
  #IMP EDIT START: TO BE REWORKED BY VISUAL NUBODY
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganMummyTorso
        - id: OrganMummyHead
        - id: OrganMummyArmLeft
        - id: OrganMummyArmRight
        - id: OrganMummyHandRight
        - id: OrganMummyHandLeft
        - id: OrganMummyLegLeft
        - id: OrganMummyLegRight
        - id: OrganMummyFootLeft
        - id: OrganMummyFootRight
        - id: OrganMummyEyes
        - id: OrganMummyBrainMote
        - id: OrganMummyHeartMote
        - id: OrganMummyLungsMote
        - id: OrganMummyLiverMote
        - id: OrganMummyKidneysMote
        - id: OrganMummyStomachMote
  - type: HumanoidAppearance
    species: Mummy
    hideLayersOnEquip:
    - HeadTop

- type: entity
  parent:   
  - AppearanceMummy
  - MobBloodstream # well theres mummy blood so
  - MobFlammable # mummys are super flamable right?
  - BaseSpeciesMob
  id: MobMummy
  name: Urist McMummy
  components:
  #they dont get hungry or thirsy, so those components aren't here
  - type: Icon
    sprite: _Impstation/Mobs/Species/Visitors/Mummy/parts.rsi
    state: full
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Mummy
  - type: Destructible #MUMMY TODO: figure out their health
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:GibBehavior { }
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: NpcFactionMember
    factions:
    - Mummy
  - type: TypingIndicator
    proto: mummy
  - type: Speech
    speechVerb: Mummy
    speechSounds: Mummy 
    allowedEmotes: ['Meow', 'Hiss']
    suffixSpeechVerbs:
      chat-speech-verb-suffix-exclamation-strong: MummyExclamationStrong
      chat-speech-verb-suffix-exclamation: MummyExclamation
      chat-speech-verb-suffix-stutter: MummyStutter
  - type: Vocal
    sounds:
      Male: UnisexMummy
      Female: UnisexMummy
      Unsexed: UnisexMummy
  - type: Access
    tags:
    - Wizard #for sarocpogus
  - type: ActionGrant
    actions:
    - ActionPolymorphDustDevil
    - ActionSandWave
    - ActionMummyWall
  - type: ActionGun
    action: ActionScarabThrow
    gunProto: ScarabGun
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: MummyBlood
        Quantity: 100 # less because they are old?
  - type: Tag #mummy tag for imprinting mobs, no anomaly host tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - Mummy

# Action gun for scarab throwing
- type: entity
  categories: [ HideSpawnMenu ]
  id: ScarabGun
  name: scarab gun
  description: Like Halo 2.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
  - type: BasicEntityAmmoProvider
    proto: MobScarab
    capacity: 1
    count: 1
  - type: Gun
    soundEmpty: null
    projectileSpeed: 5

